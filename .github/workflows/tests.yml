name: Local checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt ruff
      - name: Fetch pinned SDK parser for contract checks
        run: curl --fail --location https://raw.githubusercontent.com/AstrBotDevs/AstrBot/60c9e68d50dc9b9ed58503f21a0b77a8d0bd2159/astrbot/core/star/filter/command.py --output "$RUNNER_TEMP/AstrBot-command.py"
      - run: python -m unittest discover -s tests -v
        env:
          ASTRBOT_COMMAND_SOURCE: ${{ runner.temp }}/AstrBot-command.py
      - run: python -m ruff check .
